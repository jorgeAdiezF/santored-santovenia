version: "3.9"

networks:
  invoices_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://invoices_user:invoices_pass@postgres:5432/invoices_db
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  MINIO_URL: minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin123
  MINIO_BUCKET: invoices
  JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_change_in_production}
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

x-backend-depends: &backend-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  minio_init:
    condition: service_completed_successfully

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoices_db
      POSTGRES_USER: invoices_user
      POSTGRES_PASSWORD: invoices_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - invoices_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoices_user -d invoices_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - invoices_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - invoices_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - invoices_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  minio_init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - invoices_net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/invoices &&
        mc mb --ignore-existing local/invoices-thumbnails &&
        echo 'MinIO buckets ready'
      "
    restart: "no"

  # ─── Backend API Services ─────────────────────────────────────────────────────

  auth_service:
    build:
      context: .
      dockerfile: backend/auth_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - invoices_net
    restart: unless-stopped

  document_service:
    build:
      context: .
      dockerfile: backend/document_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      <<: *backend-env
    depends_on:
      <<: *backend-depends
    networks:
      - invoices_net
    restart: unless-stopped

  segmentation_service:
    build:
      context: .
      dockerfile: backend/segmentation_service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      <<: *backend-env
    depends_on:
      <<: *backend-depends
    networks:
      - invoices_net
    restart: unless-stopped

  ocr_service:
    build:
      context: .
      dockerfile: backend/ocr_service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      <<: *backend-env
    depends_on:
      <<: *backend-depends
    networks:
      - invoices_net
    restart: unless-stopped

  materials_service:
    build:
      context: .
      dockerfile: backend/materials_service/Dockerfile
    ports:
      - "8005:8005"
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - invoices_net
    restart: unless-stopped

  homologation_service:
    build:
      context: .
      dockerfile: backend/homologation_service/Dockerfile
    ports:
      - "8006:8006"
    environment:
      <<: *backend-env
    depends_on:
      <<: *backend-depends
    networks:
      - invoices_net
    restart: unless-stopped

  review_service:
    build:
      context: .
      dockerfile: backend/review_service/Dockerfile
    ports:
      - "8007:8007"
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - invoices_net
    restart: unless-stopped

  destinations_service:
    build:
      context: .
      dockerfile: backend/destinations_service/Dockerfile
    ports:
      - "8008:8008"
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - invoices_net
    restart: unless-stopped

  analytics_service:
    build:
      context: .
      dockerfile: backend/analytics_service/Dockerfile
    ports:
      - "8009:8009"
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - invoices_net
    restart: unless-stopped

  api_gateway:
    build:
      context: .
      dockerfile: backend/api_gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      AUTH_SERVICE_URL: http://auth_service:8001
      DOCUMENT_SERVICE_URL: http://document_service:8002
      SEGMENTATION_SERVICE_URL: http://segmentation_service:8003
      OCR_SERVICE_URL: http://ocr_service:8004
      MATERIALS_SERVICE_URL: http://materials_service:8005
      HOMOLOGATION_SERVICE_URL: http://homologation_service:8006
      REVIEW_SERVICE_URL: http://review_service:8007
      DESTINATIONS_SERVICE_URL: http://destinations_service:8008
      ANALYTICS_SERVICE_URL: http://analytics_service:8009
    depends_on:
      - auth_service
      - document_service
      - materials_service
      - analytics_service
    networks:
      - invoices_net
    restart: unless-stopped

  # ─── Celery Workers ───────────────────────────────────────────────────────────

  segmentation_worker:
    build:
      context: .
      dockerfile: backend/segmentation_service/Dockerfile
    command: celery -A workers.segmentation_worker.celery_app worker --loglevel=info -Q segmentation --concurrency=2
    environment:
      <<: *backend-env
    depends_on:
      <<: *backend-depends
    networks:
      - invoices_net
    restart: unless-stopped

  ocr_worker:
    build:
      context: .
      dockerfile: backend/ocr_service/Dockerfile
    command: celery -A workers.ocr_worker.celery_app worker --loglevel=info -Q ocr --concurrency=2
    environment:
      <<: *backend-env
    depends_on:
      <<: *backend-depends
    networks:
      - invoices_net
    restart: unless-stopped

  homologation_worker:
    build:
      context: .
      dockerfile: backend/homologation_service/Dockerfile
    command: celery -A workers.homologation_worker.celery_app worker --loglevel=info -Q homologation --concurrency=4
    environment:
      <<: *backend-env
    depends_on:
      <<: *backend-depends
    networks:
      - invoices_net
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - api_gateway
    networks:
      - invoices_net
    restart: unless-stopped
